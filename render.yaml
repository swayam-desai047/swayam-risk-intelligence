databases:
  - name: risk-db
    databaseName: riskplatform
    user: swayam
    plan: free

services:
  - type: web
    name: swayam-risk-backend
    env: docker
    dockerfilePath: infra/Dockerfile.backend
    plan: free
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port 8000
    envVars:
      - key: PORT
        value: 8000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: risk-db
          property: connectionString
